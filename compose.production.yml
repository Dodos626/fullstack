name: fullstack

services:
    db:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_USER: app
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
            POSTGRES_DB: app_db
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U app -d app_db']
            interval: 5s
            timeout: 5s
            retries: 20

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.production
        restart: unless-stopped
        environment:
            NODE_ENV: production
            PORT: 5000
            TRUST_PROXY_HOPS: 1
            DB_HOST: db
            DB_PORT: 5432
            DB_USER: app
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
            DB_NAME: app_db
            DB_SSL: 'false'
            JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
            JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
            APP_ROOT_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
            COOKIE_DOMAIN: .${APP_DOMAIN}
            COOKIE_SECURE: 'true'
            CORS_ORIGINS: https://${APP_DOMAIN},https://user.${APP_DOMAIN},https://guest.${APP_DOMAIN},https://admin.${APP_DOMAIN}
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
            interval: 5s
            timeout: 5s
            retries: 20

    web:
        build:
            context: ./frontend
            dockerfile: Dockerfile.production
            args:
                APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
        restart: unless-stopped
        environment:
            APP_DOMAIN: ${APP_DOMAIN}
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            backend:
                condition: service_healthy

volumes:
    postgres_data:
    caddy_data:
    caddy_config:
