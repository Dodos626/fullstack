services:
    db:
        image: postgres:17
        container_name: app_db
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: app_db
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d app_db']
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build: ./backend
        container_name: app_backend
        restart: always
        ports:
            - '5000:5000'
        volumes:
            - ./backend:/app
            - backend_node_modules:/app/node_modules # Named volume instead of anonymous
        environment:
            PORT: 5000
            DB_HOST: db
            DB_USER: postgres
            DB_PASSWORD: postgres
            DB_NAME: app_db
            DB_PORT: 5432
            JWT_ACCESS_SECRET: development-access-secret-change-me
            JWT_REFRESH_SECRET: development-refresh-secret-change-me
            COOKIE_DOMAIN: .lvh.me
            CORS_ORIGINS: http://lvh.me:5173,http://user.lvh.me:5173,http://guest.lvh.me:5173,http://admin.lvh.me:5173,http://localhost:5173,http://127.0.0.1:5173
            APP_ROOT_DOMAIN: lvh.me
            CHOKIDAR_USEPOLLING: 'true'
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:5000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 10

    frontend:
        build: ./frontend
        container_name: app_frontend
        restart: always
        ports:
            - '5173:5173'
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            CHOKIDAR_USEPOLLING: 'true'
            VITE_API_URL: http://lvh.me:5000/api
            VITE_APP_MODE: dev
            VITE_APP_ROOT_DOMAIN: lvh.me
            VITE_APP_PROTOCOL: http
            VITE_APP_PORT: 5173
        depends_on:
            backend:
                condition: service_healthy

volumes:
    postgres_data:
    backend_node_modules:
