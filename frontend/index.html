<!doctype html>

    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap"
        />
        <script>
            (function () {
                var storedMode;

                try {
                    storedMode = window.localStorage.getItem('themeMode');
                } catch {
                    storedMode = null;
                }

                var isDayMode =
                    storedMode === 'day' ||
                    (storedMode !== 'night' &&
                        !window.matchMedia('(prefers-color-scheme: dark)').matches);

                document.documentElement.dataset.theme = isDayMode ? 'day' : 'night';
            })();
        </script>
        <meta
            name="description"
            content="Portfolio of Theodoros Chalkidis, a software engineer working across full-stack applications, distributed systems, compilers, and graphics programming."
        />
        <meta name="author" content="Theodoros Chalkidis" />
        <meta name="theme-color" content="#080b0d" />

            content="Full-stack, distributed-systems, compiler, and graphics engineering portfolio."
