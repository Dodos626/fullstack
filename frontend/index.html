<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap"
        />
        <script>
            (function () {
                var storedMode;

                try {
                    storedMode = window.localStorage.getItem('themeMode');
                } catch {
                    storedMode = null;
                }

                var isDayMode =
                    storedMode === 'day' ||
                    (storedMode !== 'night' &&
                        !window.matchMedia('(prefers-color-scheme: dark)').matches);

                document.documentElement.dataset.theme = isDayMode ? 'day' : 'night';
            })();
        </script>
        <meta
            name="description"
            content="Theodoros Chalkidis portfolio and full-stack application platform"
        />
        <title>Theodoros Chalkidis</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
