        />
        <script>
            (function () {
                var storedMode;

                try {
                    storedMode = window.localStorage.getItem('themeMode');
                } catch {
                    storedMode = null;
                }

                var isDayMode =
                    storedMode === 'day' ||
                    (storedMode !== 'night' &&
                        !window.matchMedia('(prefers-color-scheme: dark)').matches);

                document.documentElement.dataset.theme = isDayMode ? 'day' : 'night';
            })();
        </script>
