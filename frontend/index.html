<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap"
    />
    <script>
      (function () {
        var match = document.cookie.match(/(?:^|; )dayMode=([^;]+)/);
        var cookieValue = match ? match[1] : null;
        var isDayMode;

        if (cookieValue === 'day') {
          isDayMode = true;
        } else if (cookieValue === 'night') {
          isDayMode = false;
        } else if (window.matchMedia) {
          isDayMode = !window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else {
          isDayMode = true;
        }

        document.documentElement.dataset.theme = isDayMode ? 'day' : 'night';
      })();
    </script>
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
